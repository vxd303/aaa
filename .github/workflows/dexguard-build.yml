name: DexGuard Build Test

on:
  workflow_dispatch:
    inputs:
      use-dexguard-stub:
        description: "Use the DexGuard stub implementation instead of the real plugin"
        type: boolean
        default: true
      use-embrace-stub:
        description: "Use the Embrace stub classes instead of the swazzler plugin"
        type: boolean
        default: true
  pull_request:
    branches:
      - development
      - main

jobs:
  dexguard:
    name: Run DexGuard build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Determine stub flags
        id: flags
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ inputs.use-dexguard-stub }}" = "false" ]; then
              echo "dexguard_stub=false" >> "$GITHUB_OUTPUT"
            else
              echo "dexguard_stub=true" >> "$GITHUB_OUTPUT"
            fi
            if [ "${{ inputs.use-embrace-stub }}" = "false" ]; then
              echo "embrace_stub=false" >> "$GITHUB_OUTPUT"
            else
              echo "embrace_stub=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "dexguard_stub=true" >> "$GITHUB_OUTPUT"
            echo "embrace_stub=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 17 for Android SDK tools
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        uses: android-actions/setup-android@v3
        with:
          api-level: 29
          build-tools: 29.0.3

      - name: Set up JDK 11 for Gradle
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '11'
          cache: gradle

      - name: Generate placeholder secrets
        if: steps.flags.outputs.dexguard_stub == 'true'
        run: ./ci/create-placeholder-secrets.sh

      - name: Run DexGuard release build
        env:
          CI: true
        run: ./gradlew --no-daemon -PuseEmbraceStub=${{ steps.flags.outputs.embrace_stub }} -PuseDexguardStub=${{ steps.flags.outputs.dexguard_stub }} :AM:dexguardRelease
